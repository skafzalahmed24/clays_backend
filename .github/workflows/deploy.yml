name: Deploy mershai Backend

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Lint
        run: |
          npm ci
          npm run lint

      - name: Sync to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "./*,!node_modules"
          target: "/var/www/mershai/backend"
          overwrite: true

      - name: Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            export PATH=$PATH:/home/${{ secrets.SSH_USER }}/.nvm/versions/node/v20.11.0/bin:/usr/local/bin
            cd /var/www/mershai/backend
            echo "${{ secrets.ENV_FILE }}" > .env
            npm install --production
            pm2 restart mershai-api || pm2 start server.js --name mershai-api
            pm2 save
